modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Felipe"
description='''
Acha sozinho onde estão os olhos na skin de cada jogador e dá vida ao rosto: pisca, olha para quem está perto, faz
careta de dor, fecha os olhos dormindo, fica cansado e chora com pouca vida, faz cara de raiva brigando, arregala os
olhos pegando fogo ou caindo, sorri comendo, cora com alguém bem perto e sente frio na neve fofa. Piscadela na
vírgula, menu de expressões no ponto. /olhos mostra onde os olhos foram achados na sua skin. Só cliente.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version_min},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
